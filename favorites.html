<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorite Jobs - AI Job Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <header id="main-header"></header>
    <main>
        <section class="hero">
            <div>
                <p class="eyebrow">SAVED OPPORTUNITIES</p>
                <h1>Your Favorite AI Jobs</h1>
                <p class="hero-text">
                    Review and manage all the Artificial Intelligence positions you saved for later.
                </p>
            </div>
        </section>

        <section class="jobs-section">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">BOOKMARKS</p>
                    <h2>Saved Jobs</h2>
                </div>
                <p id="results-count" class="results-count"></p>
            </div>

            <div id="status-message" class="status-message" aria-live="polite"></div>
            <div id="jobs-container" class="jobs-grid"></div>
        </section>
    </main>
    <footer id="main-footer"></footer>
    <script type="module" src="scripts/favorites.mjs"></script>
</body>
</html>
