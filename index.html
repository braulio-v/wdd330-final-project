<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <header id="main-header"></header>

  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">AI CAREER HUB</p>
        <h1>Find your next AI opportunity.</h1>
        <p class="hero-text">
          Search and filter Artificial Intelligence jobs using current data from the AI Jobs API.
        </p>
      </div>
    </section>

    <section class="controls-section" aria-label="Job search and filters">
      <form id="search-form" class="search-form">
        <label for="search-input">Search jobs</label>
        <div class="search-row">
          <input
            id="search-input"
            type="search"
            placeholder="Search by job title or company..."
            autocomplete="off"
          >
          <button type="submit" class="button primary-button">Search</button>
        </div>
      </form>

      <div class="filters">
        <label>
          Experience Level
          <select id="level-filter">
            <option value="all">All Levels</option>
            <option value="Intern">Intern</option>
            <option value="Entry">Entry</option>
            <option value="Mid">Mid</option>
            <option value="Senior">Senior</option>
            <option value="Lead+">Lead+</option>
          </select>
        </label>

        <label>
          Work Type
          <select id="remote-filter">
            <option value="all">All Jobs</option>
            <option value="remote">Remote Only</option>
            <option value="onsite">On-site Only</option>
          </select>
        </label>

        <button id="clear-filters" type="button" class="button secondary-button">
          Clear
        </button>
      </div>
    </section>

    <section class="jobs-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">LATEST OPPORTUNITIES</p>
          <h2>AI Jobs</h2>
        </div>
        <p id="results-count" class="results-count"></p>
      </div>

      <div id="status-message" class="status-message" aria-live="polite"></div>
      <div id="jobs-container" class="jobs-grid"></div>
    </section>
  </main>

  <div id="job-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-close" class="modal-close" type="button" aria-label="Close job details">
        &times;
      </button>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer id="main-footer"></footer>

  <script type="module" src="scripts/main.mjs"></script>
</body>
</html>
